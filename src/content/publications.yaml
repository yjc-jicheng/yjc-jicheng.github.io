  abstract:
    en: >
      Multi-omics analysis of immune–microenvironmental crosstalk shows that
      harpagide protects against acute lung injury through convergent HIF-1α, Nrf2,
      and PI3K signaling. The study integrates single-cell transcriptomics with
      blood and lung proteomics in preclinical models.
    zh: >
      通过多组学解析免疫—微环境互作，发现哈巴苷经 HIF-1α、Nrf2 与 PI3K 信号的
