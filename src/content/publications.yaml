- id: yindan-apap-2026
  title: "Yindan Pinggan Capsules alleviates acetaminophen-induced liver injury by modulating ferroptosis via the system Xc−/GSH/GPX4 axis and the LPCAT3–ACSL4 pathway"
  authors: ["Yang, J.", "Zhang, Y.", "Yang, R.", "Zhang, F.", "Jiang, X.", "Zhuang, Y.", "Li, X.", "Yang, H."]
  me: "Yang, J."
  role: { en: "Co-first author", zh: "共同第一作者" }
  year: 2026
  venue: "Science of Traditional Chinese Medicine"
  venue_short: "Sci. Tradit. Chin. Med."
  status: published
  volume: ""
  pages: ""
  doi: "10.1097/ST9.0000000000000136"
  selected: true
  topics: ["proteomics", "ferroptosis", "liver injury"]
  figure: "generated/volcano"
  links: { pdf: "", code: "", data: "" }
  abstract:
    en: >
      We combined proteomic and transcriptomic profiling with functional assays to
      show that Yindan Pinggan capsules alleviate acetaminophen-induced liver injury
      by suppressing ferroptosis through the Xc−/GSH/GPX4 axis and the
      LPCAT3–ACSL4 pathway. The study defines a candidate mechanistic axis in
      preclinical models; clinical efficacy was not tested.
    zh: >
      结合蛋白质组、转录组与功能实验，发现菌胆平肝胶囊通过 Xc−/GSH/GPX4 轴与
      LPCAT3–ACSL4 通路抑制铁死亡，从而减轻对乙酰氨基酚诱导的肝损伤。该研究在
      临床前模型中提出了一条候选机制轴，未评价临床疗效。
  tldr:
    en: "Ferroptosis suppression via Xc−/GSH/GPX4 and LPCAT3–ACSL4 underlies the hepatoprotective effect."
    zh: "通过 Xc−/GSH/GPX4 与 LPCAT3–ACSL4 抑制铁死亡是其肝保护机制。"

- id: yindan-ccl4-2026
  title: "Yin-Dan-Ping-Gan Capsule mitigates CCL4-induced liver fibrosis via regulating PPARγ/GPX4 signaling and suppressing ferroptosis"
  authors: ["Jiang, X.", "Yang, J.", "Zhang, Y.", "Zhang, Y.", "Ouyang, Z.", "Zhao, C.", "Lin, L.", "Li, X.", "Huang, L."]
  me: "Yang, J."
  role: { en: "Second author", zh: "第二作者" }
  year: 2026
  venue: "Pharmaceuticals"
  venue_short: "Pharmaceuticals"
  status: published
  volume: "19"
  pages: "251"
  doi: "10.3390/ph19020251"
  selected: false
  topics: ["proteomics", "network pharmacology", "liver fibrosis"]
  figure: "generated/network"
  links: { pdf: "", code: "", data: "" }
  abstract:
    en: >
      Integrating proteomics, network pharmacology, and deep learning, we show that
      Yin-Dan-Ping-Gan capsules mitigate CCL4-induced liver fibrosis by activating
      PPARγ/GPX4 signaling and suppressing ferroptosis. The evidence is preclinical
      and identifies a candidate antifibrotic axis rather than a clinical therapy.
    zh: >
      整合蛋白质组、网络药理学与深度学习，发现菌胆平肝胶囊通过激活 PPARγ/GPX4
      信号、抑制铁死亡来减轻 CCL4 诱导的肝纤维化。证据来自临床前研究，提出的是
      候选抗纤维化机制轴，而非临床治疗方案。
  tldr:
    en: "PPARγ–GPX4 activation and ferroptosis suppression drive the antifibrotic effect."
    zh: "PPARγ–GPX4 激活与铁死亡抑制共同驱动抗纤维化作用。"

- id: peony-skin-2026
