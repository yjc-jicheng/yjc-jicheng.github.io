  topics: ["proteomics", "skin barrier"]
  figure: "generated/spatial"
  links: { pdf: "", code: "", data: "" }
  abstract:
    en: >
      In a mouse tape-stripping model, peony flower extract restored skin barrier
      function and was associated with upregulation of multiple barrier-related
      proteins. The study links a proteomics-informed protein set to a measurable
      skin phenotype in mice.
    zh: >
      在小鼠胶带剥离模型中，凤丹牡丹花提取物改善了皮肤屏障功能，并伴随多种屏障
      相关蛋白上调。研究把蛋白质组学提示的蛋白集合与小鼠皮肤表型联系起来。
  tldr:
    en: "Peony flower extract repairs the skin barrier in a mouse model."
    zh: "凤丹牡丹花提取物在小鼠模型中修复皮肤屏障。"

