# ============================================================
#  图集 —— 当前全部指向程序化生成的抽象图（public/img/generated/）
#  换成真图时：把源图放 assets/_source/，跑 npm run images 生成衍生物，
#  再把 src 改成 "img/<name>" 并填真实 width/height。
#  注意：未发表数据、合作方数据、患者影像不要放上公网。
# ============================================================

- id: peptide-spectrum
  src: "generated/spectrum"
  width: 1200
  height: 800
  kind: svg
  caption:
    en: "Schematic: a peptide mass spectrum with annotated peaks (illustration, not data)."
    zh: "示意图：带峰标注的肽段质谱图（图示，非真实数据）。"
  alt:
    en: "Abstract mass spectrum with a series of vertical peaks of varying height along a horizontal m/z axis."
    zh: "抽象质谱图：沿水平 m/z 轴分布着一系列高度不同的垂直峰。"
  credit: { en: "Illustration", zh: "示意图" }
  tags: ["schematic", "mass spectrometry", "proteomics"]

- id: proteomics-workflow
  src: "generated/workflow"
  width: 1200
  height: 800
  kind: svg
  caption:
    en: "Schematic: from sample preparation and LC-MS/MS to statistics and PRM validation."
