- id: differential-abundance
  src: "generated/volcano"
  width: 1200
  height: 800
  kind: svg
  caption:
    en: "Schematic: differential abundance volcano plot with two significance wings (illustration)."
    zh: "示意图：差异丰度火山图，两侧为显著性变化的蛋白（图示）。"
  alt:
    en: "Abstract volcano plot with points scattered across two significance wings and dashed threshold lines."
    zh: "抽象火山图：散点分布在两侧显著区域，并有虚线阈值。"
  credit: { en: "Illustration", zh: "示意图" }
