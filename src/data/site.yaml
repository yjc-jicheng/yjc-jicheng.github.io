# 首页前两三句话：在做什么、用什么方法、关心什么问题。
bio:
  en: >
    I use mass spectrometry-based proteomics, spatial omics, and machine learning
    to study how traditional Chinese medicines act in acute liver injury, acute
    lung injury, ulcerative colitis, and heart failure. I am particularly interested
    in turning high-throughput discovery into mechanistic hypotheses and blood
    biomarkers that can be validated by targeted PRM assays.
  zh: >
    我使用基于质谱的蛋白质组学、空间组学与机器学习，研究中药在急性肝损伤、
    急性肺损伤、溃疡性结肠炎与心力衰竭中的作用机制，并关注如何把高通量发现
    转化为可验证的机制假设与血液标志物，最终通过 PRM 靶向质谱完成验证。

